<div class="form-container">
  <div class="form-card">
    <h2>{{ (requestId ? 'REQUESTS.EDIT_TITLE' : 'REQUESTS.NEW_TITLE') | translate }}</h2>
    
    <form [formGroup]="requestForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label>{{ 'REQUESTS.APPLICANT_NAME' | translate }}</label>
        <input type="text" formControlName="applicantName" [placeholder]="'REQUESTS.APPLICANT_NAME_PLACEHOLDER' | translate" />
      </div>

      <div class="form-group">
        <label>{{ 'AUTH.EMAIL' | translate }}</label>
        <input type="email" formControlName="applicantEmail" [placeholder]="'AUTH.EMAIL_PLACEHOLDER' | translate" />
      </div>

      <div class="form-group">
        <label>{{ 'COMMON.RESOURCE' | translate }}</label>
        <select formControlName="resourceId">
          <option [ngValue]="null" disabled>{{ 'REQUESTS.SELECT_RESOURCE' | translate }}</option>
          <option *ngFor="let res of resources$ | async" [ngValue]="res.id">
            {{ res.name }}
          </option>
        </select>
      </div>

      <div class="form-group" *ngIf="requestId">
        <label>{{ 'COMMON.STATUS' | translate }}</label>
        <select formControlName="status">
          <option value="PENDING">{{ 'REQUESTS.STATUS_PENDING' | translate }}</option>
          <option value="APPROVED">{{ 'REQUESTS.STATUS_APPROVED' | translate }}</option>
          <option value="REJECTED">{{ 'REQUESTS.STATUS_REJECTED' | translate }}</option>
        </select>
      </div>

      <div class="actions">
        <button type="button" class="btn-cancel" routerLink="/requests">{{ 'COMMON.CANCEL' | translate }}</button>
        <button type="submit" class="btn-submit" [disabled]="requestForm.invalid || (loading$ | async)">
          {{ (requestId ? 'REQUESTS.UPDATE_BTN' : 'REQUESTS.CREATE_BTN') | translate }}
        </button>
      </div>
    </form>
  </div>
</div>
